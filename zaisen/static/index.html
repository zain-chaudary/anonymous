<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ZAISEN AI</title>
<meta name="description" content="ZAISEN AI — a private chat assistant." />
<style>
  :root{
    --bg:#07080c; --panel:#0d0f16; --panel-2:#12151f; --line:#1d2130;
    --text:#e8eaf2; --muted:#8b90a6; --dim:#5d6379;
    --accent:#7c5cff; --accent-2:#22d3ee; --ok:#34d399; --warn:#fbbf24;
    --radius:14px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(600px 340px at 14% -8%, rgba(124,92,255,.16), transparent 70%),
      radial-gradient(520px 300px at 88% 4%, rgba(34,211,238,.10), transparent 70%);
  }
  .app{position:relative;z-index:1;display:flex;height:100vh;height:100dvh}

  /* ---------- sidebar ---------- */
  .side{
    width:250px;flex:0 0 250px;border-right:1px solid var(--line);
    background:rgba(13,15,22,.72);backdrop-filter:blur(12px);
    display:flex;flex-direction:column;padding:14px 12px;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:9px;padding:4px 6px 10px}
  .mark{
    width:28px;height:28px;border-radius:9px;flex:0 0 28px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;font-weight:800;font-size:14px;color:#0a0b10;
    box-shadow:0 4px 18px rgba(124,92,255,.35);
  }
  .brand h1{font-size:15px;margin:0;letter-spacing:.14em;font-weight:700}
  .brand span{display:block;font-size:10px;letter-spacing:.16em;color:var(--dim);font-weight:500}
  .new{
    width:100%;padding:10px 12px;border-radius:11px;cursor:pointer;
    border:1px solid var(--line);background:linear-gradient(180deg,#1a1e2c,#141722);
    color:var(--text);font-family:inherit;font-size:13.5px;font-weight:600;
    display:flex;align-items:center;gap:8px;transition:.15s;
  }
  .new:hover{border-color:#2c3350;background:linear-gradient(180deg,#1f2434,#171b27)}
  .threads{flex:1;overflow-y:auto;margin:4px -4px 0;padding:0 4px}
  .threads::-webkit-scrollbar{width:8px}
  .threads::-webkit-scrollbar-thumb{background:#1e2333;border-radius:8px}
  .thread{
    padding:8px 10px;border-radius:9px;font-size:13px;color:var(--muted);
    cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border:1px solid transparent;
  }
  .thread:hover{background:#12151f;color:var(--text)}
  .thread.active{background:#161a26;border-color:var(--line);color:var(--text)}
  .side-foot{font-size:11px;color:var(--dim);padding:8px 6px 2px;line-height:1.5}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px}
  .dot.ok{background:var(--ok)} .dot.demo{background:var(--warn)}

  /* ---------- main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{
    height:52px;flex:0 0 52px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;gap:12px;background:rgba(7,8,12,.6);backdrop-filter:blur(10px);
  }
  .top .title{font-size:13px;color:var(--muted);font-weight:600}
  .badge{
    font-size:11px;font-family:var(--mono);color:var(--muted);
    border:1px solid var(--line);background:#0f121b;
    padding:4px 9px;border-radius:999px;white-space:nowrap;
  }
  .badge b{color:var(--text);font-weight:600}

  .scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
  .scroll::-webkit-scrollbar{width:10px}
  .scroll::-webkit-scrollbar-thumb{background:#1b2030;border-radius:8px}
  .feed{max-width:760px;margin:0 auto;padding:26px 22px 10px}

  /* hero */
  .hero{padding:12vh 6px 0;text-align:center}
  .hero .glyph{
    width:58px;height:58px;margin:0 auto 18px;border-radius:17px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;font-size:23px;font-weight:800;color:#0a0b10;
    box-shadow:0 12px 44px rgba(124,92,255,.4);
  }
  .hero h2{margin:0 0 8px;font-size:26px;letter-spacing:.02em;font-weight:700}
  .hero p{margin:0 auto;color:var(--muted);max-width:430px;font-size:14px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:24px}
  .chip{
    padding:9px 14px;border:1px solid var(--line);border-radius:999px;
    background:#0e1119;color:var(--muted);font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  .chip:hover{color:var(--text);border-color:#333b58;transform:translateY(-1px)}

  /* messages */
  .msg{display:flex;gap:12px;padding:14px 0;animation:rise .22s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .avatar{
    width:28px;height:28px;flex:0 0 28px;border-radius:8px;display:grid;
    place-items:center;font-size:11px;font-weight:800;margin-top:2px;
  }
  .msg.user .avatar{background:#1b2030;color:var(--muted);border:1px solid var(--line)}
  .msg.ai .avatar{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0a0b10}
  .body{min-width:0;flex:1}
  .who{font-size:11px;letter-spacing:.1em;color:var(--dim);font-weight:700;margin-bottom:3px}
  .content{word-wrap:break-word;overflow-wrap:anywhere}
  .content p{margin:0 0 10px} .content p:last-child{margin-bottom:0}
  .content code{
    font-family:var(--mono);font-size:.87em;background:#181c28;
    border:1px solid var(--line);padding:1.5px 5px;border-radius:5px;
  }
  .content pre{
    background:#0c0f16;border:1px solid var(--line);border-radius:11px;
    padding:13px 15px;overflow-x:auto;margin:10px 0;position:relative;
  }
  .content pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.55}
  .content ul,.content ol{margin:8px 0;padding-left:22px}
  .content li{margin:3px 0}
  .content a{color:var(--accent-2)}
  .content h3{font-size:15px;margin:14px 0 6px}
  .content hr{border:0;border-top:1px solid var(--line);margin:14px 0}
  .content blockquote{
    margin:10px 0;padding:2px 0 2px 13px;border-left:2px solid var(--accent);color:var(--muted);
  }
  .cursor::after{
    content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite;margin-left:1px;
  }
  @keyframes blink{50%{opacity:0}}
  .msg-actions{display:flex;gap:6px;margin-top:8px;opacity:0;transition:.15s}
  .msg:hover .msg-actions{opacity:1}
  .mini{
    background:none;border:1px solid var(--line);color:var(--dim);border-radius:7px;
    font-size:11px;padding:3px 9px;cursor:pointer;font-family:inherit;
  }
  .mini:hover{color:var(--text);border-color:#333b58}
  .err{color:#fca5a5;font-size:13px}

  /* composer */
  .dock{padding:0 22px 14px;background:linear-gradient(180deg,transparent,var(--bg) 40%)}
  .composer{
    max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:16px;
    background:#0e1119;padding:10px 10px 8px 14px;transition:.15s;
    box-shadow:0 10px 40px rgba(0,0,0,.45);
  }
  .composer:focus-within{border-color:#3a3f63;box-shadow:0 10px 44px rgba(124,92,255,.14)}
  .row{display:flex;align-items:flex-end;gap:10px}
  textarea{
    flex:1;background:none;border:0;outline:none;resize:none;color:var(--text);
    font-family:inherit;font-size:15px;line-height:1.55;max-height:180px;
    padding:6px 0;min-height:26px;
  }
  textarea::placeholder{color:var(--dim)}
  .send{
    width:34px;height:34px;flex:0 0 34px;border-radius:10px;border:0;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0a0b10;
    display:grid;place-items:center;font-size:16px;font-weight:800;transition:.15s;
  }
  .send:disabled{opacity:.35;cursor:not-allowed}
  .send.stop{background:#2a1b1b;color:#fca5a5;border:1px solid #4a2a2a}
  .under{
    max-width:760px;margin:8px auto 0;display:flex;justify-content:space-between;
    gap:10px;font-size:11px;color:var(--dim);
  }
  .under a{color:var(--dim);text-decoration:none;border-bottom:1px dotted #333}
  .hint kbd{
    font-family:var(--mono);font-size:10px;background:#141824;border:1px solid var(--line);
    border-radius:4px;padding:1px 4px;
  }
  .banner{
    max-width:760px;margin:0 auto 10px;border:1px solid #3d3320;background:#1b1710;
    color:#e8d9b5;border-radius:10px;padding:8px 12px;font-size:12px;display:none;
  }
  .banner.show{display:block}

  @media (max-width:820px){
    .side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);
      transition:transform .2s;width:270px}
    .side.open{transform:none}
    .menu{display:grid!important}
    .feed{padding:18px 14px 6px}
    .dock{padding:0 12px 12px}
  }
  .menu{display:none;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19}
  .scrim.show{display:block}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark">Z</div>
      <div><h1>ZAISEN AI</h1><span>PRIVATE CHAT</span></div>
    </div>
    <button class="new" id="newChat">＋ New chat</button>
    <div class="threads" id="threads"></div>
    <div class="side-foot">
      <span class="dot" id="statusDot"></span><span id="statusText">connecting…</span>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="top">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu" id="menu">☰</button>
        <span class="title" id="chatTitle">New conversation</span>
      </div>
      <span class="badge" id="modelBadge">checking…</span>
    </div>

    <div class="scroll" id="scroll">
      <div class="feed" id="feed">
        <div class="hero" id="hero">
          <div class="glyph">Z</div>
          <h2>How can I help?</h2>
          <p>Ask anything. Messages stay in this conversation and its memory.</p>
          <div class="chips">
            <button class="chip">Explain a concept simply</button>
            <button class="chip">Debug this error</button>
            <button class="chip">Draft a reply to an email</button>
            <button class="chip">Plan my week</button>
          </div>
        </div>
      </div>
    </div>

    <div class="dock">
      <div class="banner" id="banner"></div>
      <div class="composer">
        <div class="row">
          <textarea id="input" rows="1" placeholder="Message ZAISEN AI…"></textarea>
          <button class="send" id="send" aria-label="Send">↑</button>
        </div>
      </div>
      <div class="under">
        <span class="hint"><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> newline</span>
        <a href="#" id="providerLink">provider info</a>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const feed = $("feed"), scroll = $("scroll"), input = $("input"), send = $("send");
  let health = {mode:"connecting", model:"—", configured:false};
  let threads = [];          // {id, title, messages:[{role,text}]}
  let current = null;
  let controller = null;
  const seenRelay = new Set();
  let relayTimer = null;

  const uid = () => Math.random().toString(36).slice(2, 10);
  const escapeHTML = (s) => s.replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

  // ---- tiny safe markdown ----
  function md(src){
    const blocks = [];
    let text = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      blocks.push({lang, code});
      return `\u0000${blocks.length - 1}\u0000`;
    });
    text = escapeHTML(text);
    text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    text = text.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    text = text.replace(/^### (.+)$/gm, "<h3>$1</h3>");
    text = text.replace(/^> (.+)$/gm, "<blockquote>$1</blockquote>");
    text = text.replace(/^---$/gm, "<hr>");
    text = text.replace(/^\s*[-*] (.+)$/gm, "<li>$1</li>");
    text = text.replace(/^\s*\d+\. (.+)$/gm, "<li>$1</li>");
    text = text.replace(/(?:^|\n)((?:<li>.+<\/li>\n?)+)/g,
      (_, run) => `\n<ul>${run.replace(/\n/g, "")}</ul>\n`);
    text = text.split(/\n{2,}/).map((p) => {
      if (/^\s*<(ul|h3|hr|blockquote|pre)/.test(p)) return p;
      return `<p>${p.replace(/\n/g, "<br>")}</p>`;
    }).join("");
    return text.replace(/\u0000(\d+)\u0000/g, (_, i) => {
      const b = blocks[+i];
      return `<pre><code data-lang="${escapeHTML(b.lang || "")}">${escapeHTML(b.code.replace(/\n$/, ""))}</code></pre>`;
    });
  }

  // ---- storage ----
  const KEY = "zaisen.threads.v1";
  function load(){
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || "[]");
      threads = Array.isArray(raw) ? raw.slice(0, 30) : [];
    } catch { threads = []; }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(threads.slice(0, 30))); } catch {}
  }

  // ---- rendering ----
  function scrollBottom(){ scroll.scrollTop = scroll.scrollHeight; }

  function paintSidebar(){
    const box = $("threads");
    box.innerHTML = "";
    threads.forEach((t) => {
      const el = document.createElement("div");
      el.className = "thread" + (current && t.id === current.id ? " active" : "");
      el.textContent = t.title || "New conversation";
      el.title = t.title || "";
      el.onclick = () => { current = t; paintSidebar(); paintChat(); $("side").classList.remove("open"); $("scrim").classList.remove("show"); };
      box.appendChild(el);
    });
  }

  function bubble(role, text, streaming){
    const wrap = document.createElement("div");
    wrap.className = "msg " + (role === "user" ? "user" : "ai");
    wrap.innerHTML = `
      <div class="avatar">${role === "user" ? "YOU" : "Z"}</div>
      <div class="body">
        <div class="who">${role === "user" ? "YOU" : "ZAISEN AI"}</div>
        <div class="content${streaming ? " cursor" : ""}"></div>
        <div class="msg-actions"></div>
      </div>`;
    const content = wrap.querySelector(".content");
    content.innerHTML = md(text || "");
    if (!streaming && text) {
      const copy = document.createElement("button");
      copy.className = "mini"; copy.textContent = "Copy";
      copy.onclick = () => {
        navigator.clipboard.writeText(text).then(() => {
          copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1200);
        });
      };
      wrap.querySelector(".msg-actions").appendChild(copy);
    }
    feed.appendChild(wrap);
    return content;
  }

  function paintChat(){
    feed.innerHTML = "";
    $("chatTitle").textContent = (current && current.title) || "New conversation";
    if (!current || !current.messages.length){
      feed.innerHTML = document.getElementById("heroTemplate").innerHTML;
      bindChips();
    } else {
      current.messages.forEach((m) => bubble(m.role, m.text, false));
    }
    scrollBottom();
  }

  function bindChips(){
    feed.querySelectorAll(".chip").forEach((c) => {
      c.onclick = () => { input.value = c.textContent; input.focus(); sendMessage(); };
    });
  }

  // ---- chat ----
  function newThread(){
    const t = { id: uid(), title: "New conversation", messages: [] };
    threads.unshift(t); current = t; save(); paintSidebar(); paintChat();
  }

  function setBusy(busy){
    send.disabled = false;
    send.textContent = busy ? "■" : "↑";
    send.classList.toggle("stop", busy);
  }

  async function sendMessage(){
    const text = input.value.trim();
    if (!text) return;
    if (!current) newThread();
    if (current.messages.length === 0) current.title = text.slice(0, 42);
    current.messages.push({ role: "user", text });
    input.value = ""; input.style.height = "auto";
    paintSidebar();
    feed.innerHTML = "";
    current.messages.forEach((m) => bubble(m.role, m.text, false));

    const node = bubble("assistant", "", true);
    setBusy(true);
    controller = new AbortController();
    let answer = "";

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: current.id, message: text }),
        signal: controller.signal,
      });
      if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if (payload === "[DONE]") continue;
          try {
            const obj = JSON.parse(payload);
            if (typeof obj.delta === "string") {
              answer += obj.delta;
              node.innerHTML = md(answer);
              scrollBottom();
            }
          } catch {}
        }
      }
      node.classList.remove("cursor");
      node.innerHTML = md(answer);
      node.parentElement.querySelector(".msg-actions").innerHTML = "";
      const copy = document.createElement("button");
      copy.className = "mini"; copy.textContent = "Copy";
      copy.onclick = () => navigator.clipboard.writeText(answer)
        .then(() => { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1200); });
      node.parentElement.querySelector(".msg-actions").appendChild(copy);
      current.messages.push({ role: "assistant", text: answer });
      save(); scrollBottom();
    } catch (err) {
      node.classList.remove("cursor");
      if (err.name === "AbortError") {
        node.innerHTML = md(answer + "\n\n_(stopped)_");
        if (answer) current.messages.push({ role: "assistant", text: answer });
        save();
      } else {
        node.innerHTML = `<span class="err">Connection failed: ${escapeHTML(err.message)}. Is the server still running?</span>`;
      }
    } finally {
      setBusy(false); controller = null; input.focus();
    }
  }

  // ---- relay: pull answers posted by an agent session ----
  async function pollRelay(){
    if (!current) return;
    try {
      const res = await fetch("/api/relay/thread");
      if (!res.ok) return;
      const data = await res.json();
      for (const m of data.messages || []) {
        if (m.kind !== "reply") continue;
        if (seenRelay.has(m.id)) continue;
        seenRelay.add(m.id);
        if (m.session && current.id && m.session !== current.id) continue;
        if (current.messages.some((x) => x.text === m.text)) continue;
        current.messages.push({ role: "assistant", text: m.text });
        bubble("assistant", m.text, false);
        save();
        scrollBottom();
      }
    } catch {}
  }

  function startRelayWatch(){
    if (relayTimer) return;
    pollRelay();
    relayTimer = setInterval(pollRelay, 8000);
  }

  // ---- boot ----
  async function boot(){
    load();
    // keep a hidden copy of the hero so paintChat can restore it
    const tpl = document.createElement("div");
    tpl.id = "heroTemplate";
    tpl.style.display = "none";
    tpl.innerHTML = $("hero").outerHTML;
    document.body.appendChild(tpl);

    if (threads.length) current = threads[0];
    paintSidebar();
    paintChat();
    bindChips();

    try {
      const res = await fetch("/api/health");
      health = await res.json();
    } catch { health = { mode:"offline", model:"—", configured:false }; }

    $("modelBadge").innerHTML = `<b>${escapeHTML(health.mode)}</b> · ${escapeHTML(health.model)}`;
    const ok = health.configured;
    $("statusDot").className = "dot " + (ok ? "ok" : "demo");
    $("statusText").textContent = ok
      ? `brain: ${health.mode}`
      : "demo mode — no model connected";
    if (health.relay) {
      startRelayWatch();
      $("banner").classList.add("show");
      $("banner").innerHTML =
        "Relay mode: messages queue in the mailbox and are answered by an Arena " +
        "agent session. Replies appear here within ~8s of being posted. " +
        "No automatic wake-up — someone has to open a session and check.";
    } else if (!ok) {
      $("banner").classList.add("show");
      $("banner").textContent =
        "Demo mode: the app works, but no model is connected. Start Ollama or set ZAISEN_PROVIDER / ZAISEN_BASE_URL / ZAISEN_MODEL.";
    }
    $("providerLink").onclick = (e) => {
      e.preventDefault();
      alert(`ZAISEN AI\\n\\nprovider: ${health.mode}\\nmodel: ${health.model}\\n\\n` +
            (health.relay
              ? "Relay mode: messages are posted to a mailbox that an Arena agent " +
                "session reads when it is open. Replies are not real-time."
              : "This app calls the model provider directly from your own server."));
    };
  }

  // ---- events ----
  send.onclick = () => { if (controller) controller.abort(); else sendMessage(); };
  $("newChat").onclick = newThread;
  $("menu").onclick = () => { $("side").classList.add("open"); $("scrim").classList.add("show"); };
  $("scrim").onclick = () => { $("side").classList.remove("open"); $("scrim").classList.remove("show"); };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  });

  boot();
})();
</script>
</body>
</html>
