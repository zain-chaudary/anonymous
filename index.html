<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Leader 2026 — Pakistan</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">🇵🇰 <b>WORLD LEADER 2026</b> <span id="date" class="date"></span></div>
    <div id="topstats" class="topstats"></div>
    <div class="controls">
      <button id="endmonth" class="btn primary big">▶ End Month</button>
      <button id="newtab" class="btn" title="Open in new tab">↗ New Tab</button>
      <button id="save" class="btn">💾</button>
      <button id="reset" class="btn danger">⟲</button>
    </div>
  </header>

  <main id="main">
    <section id="mapwrap">
      <canvas id="map" width="980" height="560"></canvas>
      <div class="maplegend">
        <span><i style="background:#0a7d32"></i> Ally</span>
        <span><i style="background:#7fb069"></i> Friendly</span>
        <span><i style="background:#d9bf77"></i> Neutral</span>
        <span><i style="background:#d98e5f"></i> Unfriendly</span>
        <span><i style="background:#c0392b"></i> Hostile</span>
        <span><i style="background:#16a34a"></i> YOU</span>
      </div>
    </section>

    <section id="side">
      <nav id="tabs">
        <button class="tabbtn on" data-tab="pakistan">🇵🇰 Pakistan</button>
        <button class="tabbtn" data-tab="country">🌍 Country</button>
        <button class="tabbtn" data-tab="orders">📜 Orders</button>
        <button class="tabbtn" data-tab="military">⚔ Military</button>
        <button class="tabbtn" data-tab="intel">🕵 Intel</button>
        <button class="tabbtn" data-tab="news">📰 News</button>
      </nav>
      <div id="panel"></div>
    </section>
  </main>

  <footer id="tickerwrap"><div id="ticker"></div></footer>

  <div id="modal" class="modal" style="display:none"></div>
  <div id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
