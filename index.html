<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Leader 2026 — President of Pakistan</title>
<link rel="stylesheet" href="css/style.css">
<script>
/* show any boot error on screen instead of a blank page */
window.__errs = [];
window.addEventListener('error', function(e){
  window.__errs.push(e.message);
  var d = document.getElementById('booterr');
  if (d){ d.style.display = 'block'; d.textContent = '⚠ Error: ' + window.__errs.join(' | '); }
});
</script>
</head>
<body>

  <!-- ============ HOME VIEW: MY GOVERNMENT ============ -->
  <div id="view-home" class="view">
    <header id="topbar">
      <div class="brand">🇵🇰 <b>WORLD LEADER 2026</b></div>
      <div id="date" class="date"></div>
      <div id="topchips" class="topchips"></div>
      <div class="controls">
        <button id="endmonth" class="btn primary big">▶ End Month</button>
        <button id="openmap" class="btn mapbtn big" title="Open world map">🗺 World Map</button>
        <button id="save" class="btn" title="Save">💾</button>
        <button id="reset" class="btn danger" title="New game">⟲</button>
      </div>
    </header>

    <nav id="tabs">
      <button class="tabbtn on" data-tab="gov">🎖 My Government</button>
      <button class="tabbtn" data-tab="orders">📜 Orders</button>
      <button class="tabbtn" data-tab="intel">🕵 Intel</button>
      <button class="tabbtn" data-tab="news">📰 News</button>
    </nav>

    <div id="panel"></div>
    <footer id="tickerwrap"><div id="ticker"></div></footer>
  </div>

  <!-- ============ MAP VIEW: WORLD ============ -->
  <div id="view-map" class="view hidden">
    <aside id="rankbar">
      <div class="rankhead">
        <button id="closemap" class="btn">✕ Close</button>
        <h3>🌍 World Powers</h3>
      </div>
      <div id="ranktabs" class="seg">
        <button class="segbtn on" data-mode="countries">🏛 Countries</button>
        <button class="segbtn" data-mode="alliances">🤝 Alliances</button>
        <button class="segbtn" data-mode="companies">🏢 Companies</button>
      </div>
      <input id="ranksearch" type="text" placeholder="Search…">
      <div id="ranklist"></div>
    </aside>
    <div id="mapfull">
      <canvas id="map"></canvas>
      <div id="mapctl">
        <button id="zin" title="Zoom in">+</button>
        <button id="zout" title="Zoom out">−</button>
        <button id="zreset" title="World view">⌂</button>
        <button id="zpak" title="Go to Pakistan">★</button>
      </div>
      <div class="maplegend">
        <span><i style="background:#059669"></i> Ally</span>
        <span><i style="background:#65a30d"></i> Friendly</span>
        <span><i style="background:#7c7f87"></i> Neutral</span>
        <span><i style="background:#ea580c"></i> Unfriendly</span>
        <span><i style="background:#dc2626"></i> Hostile</span>
        <span><i style="background:#0da271"></i> ★ PAKISTAN (You)</span>
      </div>
      <div id="countrycard" class="hidden"></div>
    </div>
  </div>

  <div id="modal" class="modal" style="display:none"></div>
  <div id="toast"></div>
  <div id="booterr" style="display:none;background:#7f1d1d;color:#fff;padding:10px;font-family:monospace;position:fixed;bottom:0;left:0;right:0;z-index:999"></div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
